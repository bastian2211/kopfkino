# Läuft auf dem Hetzner-Server in /opt/kopfkino zusammen mit der .env.
# Images baut GitHub Actions und legt sie in der GitHub Container Registry ab.
#
# Kopfkino belegt KEINE Ports nach außen. Der gemeinsame Caddy auf dem Server (Eingang für alle
# Apps, macht HTTPS) erreicht den Container "kopfkino-web" über das externe Netzwerk "edge".
services:
  web:
    image: ${IMAGE_PREFIX}/kopfkino-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      default:
      edge:
        aliases:
          - kopfkino-web
    depends_on:
      api:
        condition: service_healthy

  api:
    image: ${IMAGE_PREFIX}/kopfkino-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  edge:
    external: true

volumes:
  db_data:
